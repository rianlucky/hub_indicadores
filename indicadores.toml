# Catálogo do Hub de Indicadores — Central de Gente & Dados
#
# Para adicionar um indicador: copie um bloco [[gerencia.projeto]] dentro da gerência
# certa, preencha os campos, salve e recarregue a página do Hub.
#
# status: "no ar" | "em construção"  (qualquer outro valor, como "ideia", não aparece no Hub)
# tipo do link: "streamlit" | "databricks-app" | "dashboard" | "power-bi" | "documento" | "outro"
# Link sem url ("") aparece no Hub como "link pendente".
# carga: tabela registrada em ops.v_ultima_carga (Neon); o card mostra a data da última carga dela.
#        Sem carga (ou sem conexão), o card mostra o texto de "atualizacao".
# logo: arquivo em static/logos/ (opcional; sem logo o card mostra as iniciais do projeto).

