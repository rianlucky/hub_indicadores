# Ideias e próximos passos do próprio Hub — guardadas aqui, não aparecem na página por enquanto
# prioridade: "alta" | "média" | "baixa"

[[ideia]]
titulo = "Selo de atualização em cada indicador"
descricao = "Mostrar no card quando os dados foram carregados pela última vez e se a carga deu erro, lendo ops.v_ultima_carga no Neon."
prioridade = "alta"

[[ideia]]
titulo = "Publicar o Hub no Streamlit Cloud"
descricao = "Hoje o Hub roda só em localhost. Publicar no Streamlit Cloud, como os outros painéis, para o time acessar por um link fixo."
prioridade = "alta"

[[ideia]]
titulo = "Alerta quando a carga diária falhar"
descricao = "E-mail ou mensagem no Teams quando alguma etapa do sync central terminar com erro."
prioridade = "alta"

[[ideia]]
titulo = "Dicionário de indicadores"
descricao = "Uma página por indicador com definição, fórmula, fonte, periodicidade e responsável — a mesma régua para todos os painéis."
prioridade = "média"

[[ideia]]
titulo = "Catalogar os relatórios Power BI"
descricao = "Incluir no Hub os .pbix da Carreira Muller (Dados Demográficos, Dados de Movimentação) com o link do Power BI Service, ou decidir quais migrar."
prioridade = "média"

[[ideia]]
titulo = "Formulário \"sugerir um indicador\""
descricao = "Gestores pedem indicadores novos pelo próprio Hub; os pedidos entram numa tabela e viram backlog priorizado."
prioridade = "média"

[[ideia]]
titulo = "Uso do Hub"
descricao = "Contar acessos por indicador para saber o que é mais consultado e o que pode ser aposentado."
prioridade = "baixa"
